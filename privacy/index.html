<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Retropa Privacy Policy · Official Data Statement</title>
    <meta
      name="description"
      content="Read the Retropa Privacy Policy: information collection scope, data handling, storage, sharing, and user rights for the iOS app and official website."
    />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />

    <link rel="canonical" href="https://retropa.app/privacy/" />
    <link rel="alternate" hreflang="en" href="https://retropa.app/privacy/" />

    <link rel="icon" type="image/png" href="/brand/retropa-site-logo-192.png" />
    <link rel="apple-touch-icon" href="/brand/retropa-site-logo-192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#edf2ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090b16" />

    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Retropa" />
    <meta property="og:title" content="Retropa Privacy Policy" />
    <meta property="og:description" content="Official privacy statement for Retropa iOS app and website." />
    <meta property="og:url" content="https://retropa.app/privacy/" />
    <meta property="og:image" content="https://retropa.app/brand/retropa-site-logo-512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Retropa Privacy Policy" />
    <meta name="twitter:description" content="Official privacy statement for Retropa iOS app and website." />
    <meta name="twitter:image" content="https://retropa.app/brand/retropa-site-logo-512.png" />

    <script>
      ;(() => {
        const stored = localStorage.getItem("retropa.theme")
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
        document.documentElement.classList.toggle("dark", theme === "dark")
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://retropa.app/" },
          { "@type": "ListItem", "position": 2, "name": "Privacy Policy", "item": "https://retropa.app/privacy/" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/privacy.tsx"></script>
  </body>
</html>
