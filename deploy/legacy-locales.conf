# Include inside http {}, before the server blocks. Preserve query bytes except lang.
# Keep the locale sets aligned with src/i18n/locales.ts (publishedLocales, retiredLocaleFallback).
map $arg_lang $retropa_locale_prefix {
    default "!";
    en "";
    ja /ja;
    zh-Hans /zh-Hans;
    # Retired languages (2026-09): legacy ?lang= entrypoints land on the fallback.
    zh-Hant /zh-Hans;
    de "";
    es "";
    fr "";
    it "";
    ko "";
    ru "";
    tr "";
    pt-BR "";
    vi "";
    id "";
    th "";
}
# Retired language prefixes → same path in the fallback language (308, query kept).
map $uri $retropa_retired_target {
    default "";
    ~^/zh-Hant/?$ /zh-Hans/;
    ~^/(?:de|es|fr|it|ko|ru|tr|pt-BR|vi|id|th)/?$ /;
    ~^/zh-Hant(?<retropa_rest>/.+)$ /zh-Hans$retropa_rest;
    ~^/(?:de|es|fr|it|ko|ru|tr|pt-BR|vi|id|th)(?<retropa_rest>/.+)$ $retropa_rest;
}
map $uri $retropa_legacy_page {
    default "!";
    / /;
    /index.html /;
    ~^/cores(?:/|/index\.html)?$ /cores/;
    ~^/terms(?:/|/index\.html)?$ /terms/;
    ~^/privacy(?:/|/index\.html)?$ /privacy/;
}
map $args $retropa_duplicate_language {
    default 0;
    ~*(?:^|&)lang=[^&]*(?:&[^&]*)*&lang= 1;
}
map "$retropa_duplicate_language:$retropa_locale_prefix:$retropa_legacy_page" $retropa_legacy_target {
    default "$retropa_locale_prefix$retropa_legacy_page";
    ~^1: "";
    ~^0:!: "";
    ~:!$ "";
}
map $args $retropa_kept_query {
    default $args;
    ~*^lang=[^&]*&?(?<retropa_query_tail>.*)$ $retropa_query_tail;
    ~*^(?<retropa_query_before>.+)&lang=[^&]*&(?<retropa_query_after>.+)$ "$retropa_query_before&$retropa_query_after";
    ~*^(?<retropa_query_head>.+)&lang=[^&]*$ $retropa_query_head;
}
map $retropa_kept_query $retropa_query_suffix {
    "" "";
    default "?$retropa_kept_query";
}
